name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: build, attest and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
      id-token: write # Sigstore OIDC for provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse to release if the tag and the declared version disagree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          declared=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$declared" ]; then
            echo "tag $TAG does not match declared version $declared" >&2
            exit 1
          fi
          grep -q "^## \[$declared\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$declared] section" >&2; exit 1; }

      - name: Archive the source tree users actually run
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="${REPO}-${TAG}/" -o "dist/${REPO}-${TAG}.tar.gz" HEAD

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false # release job: never restore a cache
      - name: CycloneDX SBOM of the runtime dependencies
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          npm ci --omit dev --ignore-scripts
          npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > "dist/${REPO}-${TAG}.cdx.json"

      # GitHub-hosted Sigstore provenance; verify with
      #   gh attestation verify <file> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish release with assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "See CHANGELOG.md for details. Every artifact here carries build provenance; verify with: gh attestation verify <file> --repo $GITHUB_REPOSITORY" \
            dist/*
